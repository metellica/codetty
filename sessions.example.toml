# CodeTTY Session 配置文件示例
#
# 使用方法：
#   1. 将本文件复制到项目根目录并重命名为 .codetty.toml
#   2. 或复制到 ~/.config/codetty/sessions.toml 作为全局配置
#   3. 运行 codetty up 加载配置
#
# codetty up 采用增量创建：已有同名 session 不会重复创建。

# 初始布局模式：focus-big（默认）、grid、fullscreen
layout = "focus-big"

# 初始聚焦的 session 名称（省略则聚焦第一个 session）
focus = "editor"

# ── 模板（可复用的 tmux window 配置）──────────────────────────

[template.dev]

  [[template.dev.window]]
  name = "copilot"
  command = "copilot --allow-all"

  [[template.dev.window]]
  name = "git"
  command = "lazygit"

  [[template.dev.window]]
  name = "code"
  command = "nvim ."

  [[template.dev.window]]
  name = "shell"

# ── Session 定义 ────────────────────────────────────────────

# 原生 session：直接在 CodeTTY 中运行命令
[[session]]
name = "editor"
command = ["nvim", "."]

# 原生 session：指定工作目录（相对于本文件所在目录）
# [[session]]
# name = "server"
# command = ["npm", "run", "dev"]
# dir = "./backend"

# 原生 session：省略 command 则使用默认 shell
[[session]]
name = "shell"

# 原生 session：启动时隐藏（可通过 Ctrl+A w 显示）
# [[session]]
# name = "logs"
# hidden = true

# tmux session 使用模板
# [[session]]
# name = "frontend"
# type = "tmux"
# tmux_session = "fe"
