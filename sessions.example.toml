# CodeTTY Session 配置文件示例
#
# 使用方法：
#   1. 将本文件复制到项目根目录并重命名为 .codetty.toml
#   2. 或复制到 ~/.config/codetty/sessions.toml 作为全局配置
#   3. 运行 codetty up 加载配置
#
# codetty up 采用增量创建：已有同名 session 不会重复创建。

# 初始布局模式：list（默认）、fullscreen
layout = "list"

# 初始聚焦的 session 名称（省略则聚焦第一个 session）
focus = "editor"

# ── 托管远程目标（可选）─────────────────────────────────────

# CodeTTY 使用本机 OpenSSH 客户端连接远程主机。deploy = "auto"
# 会把当前 codetty binary 原子部署到远程 ~/.local/lib/codetty/codetty，
# 然后通过远程 CodeTTY daemon 托管 session；网络断开不会终止远程任务。
#
# [remote.gpu]
# host = "gpu01"       # 支持 ~/.ssh/config 中的 Host alias
# instance = "default"
# deploy = "auto"      # auto（默认）或 never
#
# deploy = "never" 时，默认使用远程 PATH 中的 codetty，也可指定绝对路径：
# [remote.preinstalled]
# host = "build01"
# deploy = "never"
# binary = "/opt/codetty/bin/codetty"

# ── 模板（可复用的 tab 配置）────────────────────────────────

[template.dev]

  [[template.dev.tab]]
  name = "copilot"
  command = ["copilot", "--allow-all"]

  [[template.dev.tab]]
  name = "git"
  command = ["lazygit"]

  [[template.dev.tab]]
  name = "code"
  command = ["nvim", "."]

  # 省略 command 则使用默认 shell
  [[template.dev.tab]]
  name = "shell"

# ── Session 定义 ────────────────────────────────────────────

# 单 tab session：直接运行命令
[[session]]
name = "editor"
command = ["nvim", "."]

# 指定工作目录（相对于本文件所在目录）
# [[session]]
# name = "server"
# command = ["npm", "run", "dev"]
# dir = "./backend"

# 托管远程 session：command 和 dir 都在远程执行/解释
# [[session]]
# name = "gpu-agent"
# remote = "gpu"
# command = ["copilot"]
# dir = "/workspace/project"
#
# 单 tab session 也可在 tab 上声明 remote：
# [[session]]
# name = "gpu-shell"
#
#   [[session.tab]]
#   name = "shell"
#   remote = "gpu"
#   command = ["bash"]
#
# 同一 session 的所有 tab 必须位于同一个本地或远程 daemon；如需混合，
# 请拆成多个 session。多个 session 指向同一 host + instance 时会共享连接。

# Raw SSH 保持为普通本地命令，不会自动升级为托管远程模式：
# [[session]]
# name = "raw-ssh"
# command = ["ssh", "gpu01"]

# 省略 command 则使用默认 shell
[[session]]
name = "shell"

# 启动时隐藏（可通过 Ctrl+A w 显示）
# [[session]]
# name = "logs"
# hidden = true

# 使用模板创建多 tab session
# [[session]]
# name = "frontend"
# template = "dev"
# dir = "./frontend"

# 继承模板并定制：同名 tab 覆盖模板配置，新名字追加为新 tab
# [[session]]
# name = "fullstack"
# template = "dev"
#
#   [[session.tab]]
#   name = "code"
#   command = ["nvim", "~/projects"]   # 覆盖模板中的同名 tab
#
#   [[session.tab]]
#   name = "db"                        # 追加新 tab
#   command = ["docker", "compose", "up", "db"]

# 内联定义多 tab session（不使用模板）
# [[session]]
# name = "monitoring"
#
#   [[session.tab]]
#   name = "logs"
#   command = ["tail", "-f", "/var/log/app.log"]
#
#   [[session.tab]]
#   name = "htop"
#   command = ["htop"]
