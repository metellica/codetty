# CodeTTY session config file sample
#
# Usage:
#   1. Copy this file to your project root and rename it to .codetty.toml
#   2. Or copy it to ~/.config/codetty/sessions.toml as the global config
#   3. Run `codetty up` to load it
#
# `codetty up` is incremental: sessions that already exist are not recreated.

# Initial layout mode: list (default), fullscreen
layout = "list"

# Session to focus initially (omit to focus the first session)
focus = "editor"

# ── Managed remote targets (optional) ───────────────────────

# CodeTTY connects to remote hosts with the local OpenSSH client.
# deploy = "auto" atomically deploys the current codetty binary to
# ~/.local/lib/codetty/codetty on the remote, then hosts the session on the
# remote CodeTTY daemon; network drops do not kill remote tasks.
#
# [remote.gpu]
# host = "gpu01"       # ~/.ssh/config Host aliases are supported
# instance = "default"
# deploy = "auto"      # auto (default) or never
#
# With deploy = "never" the codetty found in the remote PATH is used by
# default, or point at an absolute path:
# [remote.preinstalled]
# host = "build01"
# deploy = "never"
# binary = "/opt/codetty/bin/codetty"

# ── Templates (reusable tab sets) ───────────────────────────

[template.dev]

  [[template.dev.tab]]
  name = "copilot"
  command = ["copilot", "--allow-all"]

  [[template.dev.tab]]
  name = "git"
  command = ["lazygit"]

  [[template.dev.tab]]
  name = "code"
  command = ["nvim", "."]

  # Omit command to run the default shell
  [[template.dev.tab]]
  name = "shell"

# ── Session definitions ─────────────────────────────────────

# Single-tab session: run a command directly
[[session]]
name = "editor"
command = ["nvim", "."]

# Set a working directory (relative to this file's directory)
# [[session]]
# name = "server"
# command = ["npm", "run", "dev"]
# dir = "./backend"

# Managed remote session: command and dir are executed/interpreted remotely
# [[session]]
# name = "gpu-agent"
# remote = "gpu"
# command = ["copilot"]
# dir = "/workspace/project"
#
# remote can also be declared per tab; a session may mix local and remote tabs:
# [[session]]
# name = "dev"
#
#   [[session.tab]]
#   name = "shell"              # local tab
#
#   [[session.tab]]
#   name = "agent"
#   remote = "gpu"              # remote tab (runs on gpu)
#   command = ["copilot"]
#   dir = "/workspace/project"
#
# A session-level remote is the default for its tabs; force a single tab
# local with local = true:
# [[session]]
# name = "gpu-work"
# remote = "gpu"
#
#   [[session.tab]]
#   name = "agent"
#   command = ["copilot"]       # inherits the session's remote = "gpu"
#
#   [[session.tab]]
#   name = "notes"
#   local = true                # force local execution
#
# Sessions/tabs pointing at the same host + instance share one connection.

# Raw SSH stays a plain local command; it is never auto-upgraded to
# managed remote mode:
# [[session]]
# name = "raw-ssh"
# command = ["ssh", "gpu01"]

# Omit command to run the default shell
[[session]]
name = "shell"

# Hidden at startup (show it via Ctrl+A w)
# [[session]]
# name = "logs"
# hidden = true

# Multi-tab session from a template
# [[session]]
# name = "frontend"
# template = "dev"
# dir = "./frontend"

# Inherit a template and customize: same-name tabs override the template,
# new names are appended as new tabs
# [[session]]
# name = "fullstack"
# template = "dev"
#
#   [[session.tab]]
#   name = "code"
#   command = ["nvim", "~/projects"]   # overrides the template tab
#
#   [[session.tab]]
#   name = "db"                        # appended as a new tab
#   command = ["docker", "compose", "up", "db"]

# Inline multi-tab session (no template)
# [[session]]
# name = "monitoring"
#
#   [[session.tab]]
#   name = "logs"
#   command = ["tail", "-f", "/var/log/app.log"]
#
#   [[session.tab]]
#   name = "htop"
#   command = ["htop"]
