# CodeTTY user config file sample
#
# Usage: copy this file to ~/.config/codetty/config.toml and edit as needed.
# The file is entirely optional — if it or any field is missing, CodeTTY
# falls back to sensible defaults.

[keybindings]
# Command prefix key (like tmux's Ctrl+B), in the form "ctrl+<letter>",
# e.g. "ctrl+a", "ctrl+b", "ctrl+g".
#
# Defaults to ctrl+a when empty or omitted. If you nest CodeTTY with tmux
# and both use ctrl+a, set a different prefix here to avoid conflicts.
prefix = "ctrl+a"
